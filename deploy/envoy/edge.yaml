# Yerel test dağıtıcısı. Üretim VIP'i veya veri merkezi HA kanıtı değildir.
admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
static_resources:
  listeners:
    - name: edge
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: edge
                codec_type: HTTP1
                route_config:
                  name: edge
                  virtual_hosts:
                    - name: all
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: gateways
                            timeout: 15s
                            # Retry only connection failures or explicitly refused streams;
                            # never replay arbitrary 5xx responses or post-request resets.
                            retry_policy:
                              retry_on: connect-failure,refused-stream
                              num_retries: 2
                              per_try_timeout: 5s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: gateways
      connect_timeout: 0.5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http_protocol_options: {}
      load_assignment:
        cluster_name: gateways
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: envoy
                      port_value: 10000
              - endpoint:
                  address:
                    socket_address:
                      address: envoy-2
                      port_value: 10000
      health_checks:
        - timeout: 0.25s
          interval: 0.5s
          unhealthy_threshold: 1
          healthy_threshold: 1
          tcp_health_check: {}
          always_log_health_check_failures: false
