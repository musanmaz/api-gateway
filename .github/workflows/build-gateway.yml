name: Build and publish signed gateway images

on:
  push:
    branches: [main, gateway-product-work]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go unit tests
        run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build UI
        run: cd web && npm ci && npm run build

  images:
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent
            file: deploy/docker/Dockerfile
            target: agent
          - name: api
            file: deploy/docker/Dockerfile
            target: api
          - name: web
            file: deploy/docker/Dockerfile.web
            target: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.name }}:sha-${{ github.sha }}
          provenance: true
          sbom: true
